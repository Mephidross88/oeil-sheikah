<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>L'Œil Sheikah</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Alegreya+SC:wght@500;700&family=Alegreya+Sans:ital,wght@0,400;0,500;0,700;1,400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="app" v-cloak></div>
<!-- Vue : version fixée, empreinte vérifiée par le navigateur (à recalculer en changeant de version : sha384 du fichier) -->
<script src="https://cdn.jsdelivr.net/npm/vue@3.4.38/dist/vue.global.prod.js" integrity="sha384-Z9a2xA0EIaURxthVmeQmPrgSC05eG8Lch8X4Y2+lXpTg9wcxPj2m3QNurDl5hLiS" crossorigin="anonymous"></script>
<script src="data/areas-data.js"></script>
<script src="data/checks-data.js"></script>
<script src="data/logic-data.js"></script>
<script src="data/link-data.js"></script>
<!-- cartes des zones : généré depuis la ROM de l'utilisateur (tools/soh-maps/extract_maps.mjs), absent par défaut ; jamais
     publié, donc pas demandé en ligne (GitHub Pages : cartes fabriquées dans l'appli) -->
<script>if (!/\.github\.io$/.test(location.hostname)) document.write('<script src="data/maps-data.js"><\/script>');</script>
<!-- langues livrées (data/i18n/<code>.js) : ajouter ici une ligne par langue -->
<script src="data/i18n/en.js"></script>
<script src="js/i18n.js"></script>
<script src="js/icons.js"></script>
<script src="js/data.js"></script>
<script src="js/config.js"></script>
<script src="js/entrances.js"></script>
<script src="js/items.js"></script>
<script src="js/checks.js"></script>
<script src="js/logic.js"></script>
<script src="js/state.js"></script>
<script src="js/link.js"></script>
<script src="js/components.js"></script>
<script src="js/stream.js"></script>
<!-- pages : gabarit et logique de chaque page, assemblés par js/app.js -->
<script src="js/pages/items.js"></script>
<script src="js/pages/entrances.js"></script>
<script src="js/pages/router.js"></script>
<script src="js/pages/checks.js"></script>
<script src="js/pages/dock.js"></script>
<script src="js/pages/tracking.js"></script>
<script src="js/pages/map.js"></script>
<script src="js/pages/config.js"></script>   <!-- (après map.js : formulaire des cartes) -->
<script src="js/pages/stats.js"></script>
<script src="js/pages/graph.js"></script>
<script src="js/pages/hints.js"></script>
<script src="js/app.js"></script>
</body>
</html>
