# Relais d'auto-tracking autonome (sans Node.js) : exécutables Windows, Linux et macOS construits par
# tools/soh-link/build_relay.mjs, publiés dans une release à l'envoi d'une étiquette « relais-v… »
# (git tag relais-v1.0.0 && git push origin relais-v1.0.0). Lancement manuel : exécutables en artefact, sans release.
name: Relais
on:
  push:
    tags: ['relais-v*']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    # macOS : les exécutables Mac doivent être signés (signature ad hoc, codesign)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.6
      - run: node tools/soh-link/build_relay.mjs
      - run: codesign --force --sign - dist/oeil-sheikah-relais-mac-*
      - name: Release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --title "Relais d'auto-tracking ${GITHUB_REF_NAME#relais-}" --notes-file tools/soh-link/RELEASE.md
      - if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        uses: actions/upload-artifact@v4
        with:
          name: relais
          path: dist/
